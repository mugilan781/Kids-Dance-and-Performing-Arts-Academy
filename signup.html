<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="description" content="Create your parent account at Artiste Academy — sign up to access the Parent Dashboard for enrollment, attendance, fees and recitals.">
  <title>Create Account | Artiste Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* ═══════════ SIGNUP PAGE (standalone auth card) ═══════════ */

    /* Background — warm ivory with soft brand glows (matches Login) */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: #FBF7F1;
      overflow-x: hidden;
    }
    .signup-glows {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .signup-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
    }
    .signup-glow-lavender {
      width: 520px; height: 520px;
      top: -140px; right: -100px;
      background: rgba(217, 203, 232, 0.55);
    }
    .signup-glow-peach {
      width: 480px; height: 480px;
      left: -120px; top: 22%;
      background: rgba(231, 207, 167, 0.5);
    }
    .signup-glow-green {
      width: 460px; height: 460px;
      left: 12%; bottom: -160px;
      background: rgba(176, 208, 198, 0.42);
    }

    /* Card */
    .signup-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: var(--shadow-xl);
      padding: var(--space-10);
      animation: fadeUp 0.6s var(--ease-out);
    }

    /* Branding */
    .signup-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
    }
    .signup-brand-logo {
      width: 46px; height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(84, 36, 95, 0.07);
      border: 1px solid rgba(84, 36, 95, 0.12);
      border-radius: 13px;
      padding: 3px;
    }
    .signup-brand-logo img {
      width: 40px; height: 40px;
      object-fit: contain;
      display: block;
    }
    .signup-brand-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: var(--weight-bold);
      color: var(--charcoal);
      letter-spacing: 0.01em;
    }

    /* Heading */
    .signup-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 1.9rem);
      font-weight: var(--weight-black);
      color: var(--charcoal);
      text-align: center;
      margin-bottom: var(--space-2);
    }
    .signup-subtitle {
      text-align: center;
      font-size: var(--text-base);
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto var(--space-8);
    }

    /* Inputs — page-scoped overrides */
    .signup-card .form-group { margin-bottom: var(--space-5); }
    .signup-card .form-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
    }
    .signup-card .form-control {
      background: #ffffff;
      border: 1px solid rgba(84, 36, 95, 0.18);
      border-radius: 13px;
      padding: 0.9375rem 1.125rem;
      font-size: var(--text-base);
      color: var(--charcoal);
    }
    .signup-card .form-control:focus {
      border-color: var(--orchid);
      box-shadow: 0 0 0 4px rgba(84, 36, 95, 0.1);
    }
    .signup-card .form-control::placeholder { color: var(--text-muted); }

    /* Password eye */
    .password-field { position: relative; }
    .password-toggle {
      position: absolute;
      right: 0.9375rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover { color: var(--orchid); }

    /* Terms checkbox */
    .signup-terms {
      margin: var(--space-1) 0 var(--space-6);
      align-items: flex-start;
    }
    .signup-terms .form-check-label {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .signup-terms a {
      color: var(--orchid);
      font-weight: var(--weight-semi);
      text-decoration: none;
    }
    .signup-terms a:hover { text-decoration: underline; }

    /* Create Account button */
    .signup-submit {
      width: 100%;
      height: 56px;
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      border-radius: var(--radius-full);
      box-shadow: 0 14px 30px rgba(84, 36, 95, 0.28);
      transition: all var(--duration-base) var(--ease-out);
    }
    .signup-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(84, 36, 95, 0.34);
    }

    /* Divider */
    .signup-divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .signup-divider::before,
    .signup-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(84, 36, 95, 0.12);
    }
    .signup-divider span {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Social buttons */
    .signup-social { display: flex; gap: var(--space-3); }
    .signup-social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0.875rem 1rem;
      background: #ffffff;
      border: 1.5px solid rgba(84, 36, 95, 0.3);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--charcoal);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .signup-social-btn:hover {
      border-color: var(--orchid);
      background: rgba(84, 36, 95, 0.04);
    }
    .signup-social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Footer link */
    .signup-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .signup-footer a {
      color: var(--orchid);
      font-weight: var(--weight-bold);
      text-decoration: none;
    }
    .signup-footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: var(--space-4); }
      .signup-card { padding: var(--space-6); border-radius: 24px; }
      .signup-brand { margin-bottom: var(--space-6); }
      .signup-subtitle { margin-bottom: var(--space-6); }
    }
    @media (max-width: 400px) {
      /* Stack social buttons cleanly when they cannot fit side by side */
      .signup-social { flex-direction: column; }
    }
    @media (max-width: 360px) {
      .signup-card .form-control { padding: 0.875rem 1rem; }
    }
    @media (max-height: 760px) {
      body { align-items: flex-start; padding-top: var(--space-8); padding-bottom: var(--space-8); }
    }
  </style>
</head>
<body>
<div class="page-transition" aria-hidden="true"></div>

<!-- Soft background glows -->
<div class="signup-glows" aria-hidden="true">
  <div class="signup-glow signup-glow-lavender"></div>
  <div class="signup-glow signup-glow-peach"></div>
  <div class="signup-glow signup-glow-green"></div>
</div>

<!-- Signup Card -->
<main class="signup-card" role="main" aria-labelledby="signup-title">

  <!-- Branding -->
  <div class="signup-brand">
    <div class="signup-brand-logo">
      <img src="assets/images/logo.png" alt="Artiste Academy" width="40" height="40">
    </div>
    <span class="signup-brand-name">Artiste Academy</span>
  </div>

  <!-- Heading -->
  <h1 class="signup-title" id="signup-title">Create Account</h1>
  <p class="signup-subtitle">Join our community and start your child's learning journey</p>

  <!-- Signup Form -->
  <form id="signup-form" data-form data-on-success="handleSignupSuccess" novalidate aria-label="Account registration form">
    <div class="form-group">
      <label class="form-label" for="signup-name">Full Name</label>
      <input type="text" id="signup-name" class="form-control"
             placeholder="Parent's full name"
             data-validate="required,minLength:2"
             autocomplete="name"
             aria-required="true">
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-email">Email Address</label>
      <input type="email" id="signup-email" class="form-control"
             placeholder="parent@example.com"
             data-validate="required,email"
             autocomplete="email"
             aria-required="true">
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-phone">Phone Number</label>
      <input type="tel" id="signup-phone" class="form-control"
             placeholder="(555) 123-4567"
             data-validate="required,phone"
             autocomplete="tel"
             aria-required="true">
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-password">Password</label>
      <div class="password-field">
        <input type="password" id="signup-password" class="form-control"
               placeholder="Create a strong password"
               data-validate="required,password"
               autocomplete="new-password"
               aria-required="true"
               style="padding-right:3rem;">
        <button type="button" class="password-toggle" data-password-toggle="signup-password" aria-label="Show password" title="Show password" style="display:flex;align-items:center;"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="signup-confirm">Confirm Password</label>
      <div class="password-field">
        <input type="password" id="signup-confirm" class="form-control"
               placeholder="Re-enter your password"
               data-validate="required,match:signup-password"
               autocomplete="new-password"
               aria-required="true"
               style="padding-right:3rem;">
        <button type="button" class="password-toggle" data-password-toggle="signup-confirm" aria-label="Show password" title="Show password" style="display:flex;align-items:center;"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-check signup-terms" style="cursor:pointer;">
        <input type="checkbox" id="signup-terms" data-validate="required">
        <span class="form-check-label">
          I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>
        </span>
      </label>
    </div>

    <button type="submit" class="btn btn-primary signup-submit" id="signup-submit-btn">
      Create Account
    </button>
  </form>

  <!-- Divider -->
  <div class="signup-divider" role="separator" aria-label="or sign up with">
    <span>or sign up with</span>
  </div>

  <!-- Social Signup -->
  <div class="signup-social">
    <button type="button" class="signup-social-btn" onclick="alert('Google Sign-Up — connect OAuth.')">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
      Google
    </button>
    <button type="button" class="signup-social-btn" onclick="alert('Facebook Sign-Up — connect OAuth.')">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>
      Facebook
    </button>
  </div>

  <!-- Footer link -->
  <p class="signup-footer">Already have an account? <a href="login.html">Sign In</a></p>
</main>

<script src="js/main.js"></script>
<script src="js/forms.js"></script>
<script>
function handleSignupSuccess(form) {
  localStorage.setItem('kdpa_logged_in', 'true');
  window.Artiste.Toast.show('Account created! Welcome to Artiste Academy.', 'success');
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
}
// Force light theme for this auth page (matches the reference design)
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('data-theme', 'light');
});
</script>
</body>
</html>
