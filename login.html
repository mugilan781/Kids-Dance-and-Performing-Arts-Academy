<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="description" content="Parent Login — Sign in to your Artiste Academy parent dashboard.">
  <title>Parent Login | Artiste Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* ═══════════ LOGIN PAGE (standalone auth card) ═══════════ */

    /* Background — warm ivory with soft brand glows */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      background: #FBF7F1;
      overflow-x: hidden;
    }
    .login-glows {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .login-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
    }
    .login-glow-lavender {
      width: 520px; height: 520px;
      top: -140px; right: -100px;
      background: rgba(217, 203, 232, 0.55);
    }
    .login-glow-peach {
      width: 480px; height: 480px;
      left: -120px; top: 22%;
      background: rgba(231, 207, 167, 0.5);
    }
    .login-glow-green {
      width: 460px; height: 460px;
      left: 12%; bottom: -160px;
      background: rgba(176, 208, 198, 0.42);
    }

    /* Card */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: var(--shadow-xl);
      padding: var(--space-10);
      animation: fadeUp 0.6s var(--ease-out);
    }

    /* Branding */
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      text-decoration: none;
      color: inherit;
    }
    .login-brand:hover .login-brand-name { color: var(--orchid); }
    .login-brand-logo {
      width: 46px; height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(84, 36, 95, 0.07);
      border: 1px solid rgba(84, 36, 95, 0.12);
      border-radius: 13px;
      padding: 3px;
    }
    .login-brand-logo img {
      width: 40px; height: 40px;
      object-fit: contain;
      display: block;
    }
    .login-brand-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: var(--weight-bold);
      color: var(--charcoal);
      letter-spacing: 0.01em;
    }

    /* Heading */
    .login-title {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 4vw, 2.1rem);
      font-weight: var(--weight-black);
      color: var(--charcoal);
      text-align: center;
      margin-bottom: var(--space-2);
    }
    .login-subtitle {
      text-align: center;
      font-size: var(--text-base);
      color: var(--text-muted);
      margin-bottom: var(--space-8);
    }

    /* Inputs — page-scoped overrides */
    .login-card .form-group { margin-bottom: var(--space-5); }
    .login-card .form-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
    }
    .login-card .form-control {
      background: #ffffff;
      border: 1px solid rgba(84, 36, 95, 0.18);
      border-radius: 13px;
      padding: 0.9375rem 1.125rem;
      font-size: var(--text-base);
      color: var(--charcoal);
    }
    .login-card .form-control:focus {
      border-color: var(--orchid);
      box-shadow: 0 0 0 4px rgba(84, 36, 95, 0.1);
    }
    .login-card .form-control::placeholder { color: var(--text-muted); }

    /* Password eye */
    .password-field { position: relative; }
    .password-toggle {
      position: absolute;
      right: 0.9375rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover { color: var(--orchid); }

    /* Remember / Forgot row */
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin: var(--space-1) 0 var(--space-6);
    }
    .login-remember { margin: 0; }
    .login-forgot {
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--orchid);
      text-decoration: none;
    }
    .login-forgot:hover { text-decoration: underline; }

    /* Sign In button */
    .login-submit {
      width: 100%;
      height: 60px;
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      border-radius: var(--radius-full);
      box-shadow: 0 14px 30px rgba(84, 36, 95, 0.28);
      transition: all var(--duration-base) var(--ease-out);
    }
    .login-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(84, 36, 95, 0.34);
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(84, 36, 95, 0.12);
    }
    .login-divider span {
      font-size: var(--text-xs);
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Social buttons */
    .login-social { display: flex; gap: var(--space-3); }
    .login-social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0.875rem 1rem;
      background: #ffffff;
      border: 1.5px solid rgba(84, 36, 95, 0.3);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-semi);
      color: var(--charcoal);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .login-social-btn:hover {
      border-color: var(--orchid);
      background: rgba(84, 36, 95, 0.04);
    }
    .login-social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Footer link */
    .login-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--orchid);
      font-weight: var(--weight-bold);
      text-decoration: none;
    }
    .login-footer a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: var(--space-4); }
      .login-card { padding: var(--space-6); border-radius: 24px; }
      .login-brand { margin-bottom: var(--space-6); }
      .login-subtitle { margin-bottom: var(--space-6); }
    }
    @media (max-width: 360px) {
      .login-social { gap: var(--space-2); }
      .login-social-btn { padding: 0.75rem 0.75rem; gap: 0.375rem; font-size: 0.8125rem; }
      .login-card .form-control { padding: 0.875rem 1rem; }
    }
    @media (max-height: 720px) {
      body { align-items: flex-start; padding-top: var(--space-8); padding-bottom: var(--space-8); }
    }
  </style>
</head>
<body>
<div class="page-transition" aria-hidden="true"></div>

<!-- Soft background glows -->
<div class="login-glows" aria-hidden="true">
  <div class="login-glow login-glow-lavender"></div>
  <div class="login-glow login-glow-peach"></div>
  <div class="login-glow login-glow-green"></div>
</div>

<!-- Login Card -->
<main class="login-card" role="main" aria-labelledby="login-title">

  <!-- Branding -->
  <a href="index.html" class="login-brand" title="Back to Artiste Academy homepage">
    <div class="login-brand-logo">
      <img src="assets/images/logo.png" alt="Artiste Academy" width="40" height="40">
    </div>
    <span class="login-brand-name">Artiste Academy</span>
  </a>

  <!-- Heading -->
  <h1 class="login-title" id="login-title">Welcome Back</h1>
  <p class="login-subtitle">Sign in to your parent dashboard</p>

  <!-- Login Form -->
  <form id="login-form" data-form data-on-success="handleLoginSuccess" novalidate aria-label="Login form">
    <div class="form-group">
      <label class="form-label" for="login-email">Email Address</label>
      <input type="email" id="login-email" class="form-control"
             placeholder="parent@example.com"
             data-validate="required,email"
             autocomplete="email"
             aria-required="true">
    </div>

    <div class="form-group">
      <label class="form-label" for="login-password">Password</label>
      <div class="password-field">
        <input type="password" id="login-password" class="form-control"
               placeholder="Enter your password"
               data-validate="required,minLength:6"
               autocomplete="current-password"
               aria-required="true"
               style="padding-right:3rem;">
        <button type="button" class="password-toggle" data-password-toggle="login-password" aria-label="Show password" title="Show password" style="display:flex;align-items:center;"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div class="login-options">
      <label class="form-check login-remember" style="cursor:pointer;">
        <input type="checkbox" id="remember-me">
        <span class="form-check-label">Remember me</span>
      </label>
      <a href="#forgot" class="login-forgot" onclick="alert('Password reset email sent to your registered address.')">
        Forgot password?
      </a>
    </div>

    <button type="submit" class="btn btn-primary login-submit" id="login-submit-btn">
      Sign In
    </button>
  </form>

  <!-- Divider -->
  <div class="login-divider" role="separator" aria-label="or continue with">
    <span>or continue with</span>
  </div>

  <!-- Social Login -->
  <div class="login-social">
    <a href="https://www.google.com" target="_blank" rel="noopener" class="login-social-btn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
      Google
    </a>
    <a href="https://www.facebook.com" target="_blank" rel="noopener" class="login-social-btn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/></svg>
      Facebook
    </a>
  </div>

  <!-- Footer link -->
  <p class="login-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>
</main>

<script src="js/main.js"></script>
<script src="js/forms.js"></script>
<script>
function handleLoginSuccess(form) {
  localStorage.setItem('kdpa_logged_in', 'true');
  window.Artiste.Toast.show('Login successful! Redirecting to dashboard...', 'success');
  setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
}
// Force light theme for this auth page (matches the reference design)
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('data-theme', 'light');
});
</script>
</body>
</html>
